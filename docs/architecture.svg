<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-label="JobTrack private AWS architecture: Chrome extension and browser dashboard connect through a restricted SSH tunnel to EC2 Python API and SQLite on encrypted EBS. CloudFormation provisions resources, and EC2 reads a source package from S3 using the existing sandbox IAM instance profile.">
  <defs>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#13283f}
      .subtitle{font:24px Arial,sans-serif;fill:#496073}
      .label{font:700 25px Arial,sans-serif;fill:#13283f}
      .body{font:21px Arial,sans-serif;fill:#486075}
      .small{font:19px Arial,sans-serif;fill:#486075}
      .white{font:700 24px Arial,sans-serif;fill:#fff}
      .arrow{stroke:#247aa0;stroke-width:5;fill:none;marker-end:url(#head)}
      .provision{stroke:#7890a4;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#headGrey)}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#247aa0"/></marker>
    <marker id="headGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7890a4"/></marker>
  </defs>
  <rect width="1500" height="820" fill="#f7fafc"/>
  <text x="64" y="74" class="title">JobTrack private cloud architecture</text>
  <text x="64" y="116" class="subtitle">User-reviewed capture · single-user dashboard · no inbound web ports</text>

  <rect x="54" y="174" width="574" height="430" rx="22" fill="#fff" stroke="#c6d8e4" stroke-width="3"/>
  <text x="86" y="215" class="label">Authorized user workstation</text>
  <rect x="88" y="260" width="220" height="148" rx="15" fill="#e5f4fa" stroke="#6ab3d2" stroke-width="2"/>
  <text x="111" y="307" class="label">Job page</text>
  <text x="111" y="342" class="body">JSON-LD posting</text>
  <text x="111" y="376" class="body">Chrome extension</text>
  <path d="M309 334 H362" class="arrow"/>
  <rect x="365" y="260" width="228" height="148" rx="15" fill="#dff0f5" stroke="#59a6c9" stroke-width="2"/>
  <text x="388" y="307" class="label">Dashboard</text>
  <text x="388" y="342" class="body">Review draft</text>
  <text x="388" y="376" class="body">Search · CRUD</text>
  <rect x="149" y="465" width="392" height="95" rx="14" fill="#f0f4f7" stroke="#b4c5d1" stroke-width="2"/>
  <text x="177" y="505" class="label">SSH tunnel</text>
  <text x="177" y="536" class="body">Port forwarding · trusted /32</text>
  <path d="M475 409 V462" class="arrow"/>

  <rect x="673" y="174" width="775" height="532" rx="24" fill="#edf4f8" stroke="#7ba7bd" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="705" y="216" class="label">AWS account · selected region</text>
  <rect x="732" y="280" width="376" height="244" rx="19" fill="#fff" stroke="#5c9ab9" stroke-width="3"/>
  <rect x="732" y="280" width="376" height="62" rx="18" fill="#216d92"/>
  <text x="763" y="321" class="white">EC2 · Amazon Linux 2023</text>
  <text x="764" y="382" class="label">Python API + static UI</text>
  <text x="764" y="421" class="body">Loopback port 8000</text>
  <text x="764" y="457" class="body">systemd restart</text>
  <text x="764" y="493" class="small">Security group: SSH from /32 only</text>
  <path d="M543 513 H729" class="arrow"/>
  <rect x="1161" y="316" width="246" height="163" rx="16" fill="#fff" stroke="#5c9ab9" stroke-width="3"/>
  <text x="1191" y="364" class="label">Encrypted EBS</text>
  <text x="1191" y="403" class="body">SQLite database</text>
  <text x="1191" y="440" class="small">Persists stop/start</text>
  <path d="M1110 400 H1158" class="arrow"/>
  <rect x="742" y="572" width="270" height="90" rx="14" fill="#fff" stroke="#9db7c6" stroke-width="2"/>
  <text x="768" y="612" class="label">Private S3 bucket</text>
  <text x="768" y="645" class="small">Source ZIP for bootstrap</text>
  <path d="M870 570 V528" class="provision"/>
  <rect x="1082" y="572" width="305" height="90" rx="14" fill="#fff" stroke="#9db7c6" stroke-width="2"/>
  <text x="1106" y="612" class="label">myS3Role profile</text>
  <text x="1106" y="645" class="small">S3 source read</text>
  <path d="M1095 573 L1047 524" class="provision"/>

  <rect x="61" y="671" width="526" height="94" rx="14" fill="#e9eff3" stroke="#bdced8" stroke-width="2"/>
  <text x="91" y="712" class="label">CloudFormation</text>
  <text x="91" y="746" class="body">Provisions EC2, EBS and security group</text>
  <path d="M588 716 H669 V672" class="provision"/>
  <text x="703" y="760" class="small">Private class demo; public hosting would need login and HTTPS.</text>
</svg>
